name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # Never cancel a running deploy

# Required secrets:
#   VERCEL_TOKEN      — vercel.com/account/tokens
#   VERCEL_ORG_ID     — Vercel team/org ID
#   VERCEL_PROJECT_ID — Vercel project ID
#   DATABASE_URL      — production Postgres connection string (for migrations)
#
# Frontend AND API deploy together as a single Vercel project:
#   apps/web builds to the static site, api/[[...route]].ts is the API
#   serverless function (see vercel.json for build/rewrite config).
#
# The serverless function reads DATABASE_URL / REDIS_URL / CORS_ORIGINS at
# runtime from Vercel's own Project → Environment Variables — set those in
# the Vercel dashboard, they are separate from the GitHub secrets above.

jobs:
  # ── CI gate: must pass before any deploy starts ──────────────────────────
  ci:
    name: Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sparfuchs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @sparfuchs/data-pipeline exec playwright install --with-deps chromium
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparfuchs_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # ── Run database migrations ───────────────────────────────────────────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --filter @sparfuchs/api...

      - name: Apply migrations to production database
        run: pnpm --filter @sparfuchs/api db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Deploy (frontend + API) to Vercel ─────────────────────────────────────
  deploy:
    name: Deploy → Vercel
    runs-on: ubuntu-latest
    needs: [ci, migrate]
    environment:
      name: production
      url: https://sparfuchs-berlin.vercel.app
    steps:
      - uses: actions/checkout@v4

      # `vercel build` runs vercel.json's installCommand on this runner, so
      # pnpm has to be on PATH here — without it the build fails with
      # "sh: 1: pnpm: not found".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Post-deploy smoke test ────────────────────────────────────────────────
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Smoke test — API health
        run: |
          RESPONSE=$(curl -sf https://sparfuchs-berlin.vercel.app/api/v1/health)
          echo "$RESPONSE" | grep -q '"status":"healthy"' && echo "✓ API healthy" || (echo "✗ API health check failed"; exit 1)

      - name: Smoke test — products endpoint
        run: |
          COUNT=$(curl -sf "https://sparfuchs-berlin.vercel.app/api/v1/products?limit=1" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['meta']['pagination']['total_items'])")
          [ "$COUNT" -ge 1 ] && echo "✓ Products endpoint: $COUNT items" || (echo "✗ No products found"; exit 1)

      - name: Smoke test — frontend loads
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sparfuchs-berlin.vercel.app)
          [ "$STATUS" = "200" ] && echo "✓ Frontend: HTTP $STATUS" || (echo "✗ Frontend returned HTTP $STATUS"; exit 1)
