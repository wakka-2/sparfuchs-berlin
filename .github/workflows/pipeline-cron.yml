name: Daily Price Pipeline

on:
  schedule:
    # Twice a day. GitHub often starts scheduled runs hours late (the 04:00
    # run began at 12:28 on 2026-11-18), and a second run also retries a
    # store that was blocked by a bot check in the morning.
    - cron: "0 4 * * *" # 05:00 Berlin (winter)
    - cron: "0 13 * * *" # 14:00 Berlin (winter)
  workflow_dispatch: # Allow manual trigger

# Never two runs writing prices at the same time.
concurrency:
  group: price-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Fetch store prices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # keepalive step below

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # data-pipeline imports @sparfuchs/api/db/schema, whose package exports
      # resolve to dist/. Without building the workspace dependencies first the
      # run fails with ERR_MODULE_NOT_FOUND on @sparfuchs/api/dist/db/schema.js.
      - name: Build workspace dependencies
        run: pnpm --filter @sparfuchs/data-pipeline^... build

      # Only REWE still needs a browser; the other stores are read over plain HTTP.
      - name: Install Playwright browsers
        run: pnpm --filter @sparfuchs/data-pipeline exec playwright install chromium --with-deps

      - name: Run price pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: AI match suggestions for the review queue (skipped when unset)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_ENV: production
        run: pnpm --filter @sparfuchs/data-pipeline run:once

      # GitHub disables scheduled workflows after 60 days without repository
      # activity — which silently stopped all price updates on 2026-10-05.
      # Re-enabling an enabled workflow resets that timer. Runs even when a
      # store failed, so one broken scraper cannot also stop the schedule.
      - name: Keep the daily schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline-cron.yml/enable"
